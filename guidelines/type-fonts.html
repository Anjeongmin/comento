<!-- @dsCard group="Type" viewport="700x230" name="Font pairing" subtitle="Inter (Latin/numerals) + Pretendard (Hangul)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 24px; color: var(--text-strong); }
  .big { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  .note { margin-top: 6px; font-size: 13px; color: var(--text-body); max-width: 560px; line-height: 1.5; }
  .stack { margin-top: 16px; font-size: 11px; color: var(--gray-500); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="big">AI 통화 분석 · Call Coach 2026</div>
  <div class="note">한 줄에 한글과 영문·숫자가 섞여도 일관된 리듬을 유지합니다. Inter가 라틴/숫자를, Pretendard가 한글을 담당하며 하나의 폰트 스택으로 묶여 있습니다.</div>
  <div class="stack">--font-sans: "Inter", "Pretendard", "Apple SD Gothic Neo", "Roboto", sans-serif</div>
</body>
</html>
