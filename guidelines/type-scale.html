<!-- @dsCard group="Type" viewport="700x360" name="Type scale" subtitle="Inter + Pretendard · mobile scale" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 24px; color: var(--text-strong); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); }
  .r:last-child { border-bottom: none; }
  .tag { width: 84px; flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--text-muted); font-family: ui-monospace, monospace; }
  .spec { width: 92px; flex-shrink: 0; font-size: 11px; color: var(--gray-400); }
  .sample { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="r"><span class="tag">display</span><span class="spec">24 / 700</span><span class="sample" style="font:var(--text-display)">12통 분석 완료</span></div>
  <div class="r"><span class="tag">h1</span><span class="spec">20 / 700</span><span class="sample" style="font:var(--text-h1)">안녕하세요, 김지원님</span></div>
  <div class="r"><span class="tag">h2</span><span class="spec">18 / 700</span><span class="sample" style="font:var(--text-h2)">최근 통화 목록</span></div>
  <div class="r"><span class="tag">h3</span><span class="spec">17 / 700</span><span class="sample" style="font:var(--text-h3)">대화 팁: 신뢰도를 높이는 마무리</span></div>
  <div class="r"><span class="tag">body</span><span class="spec">16 / 400</span><span class="sample" style="font:var(--text-body)">AI가 당신의 통화를 분석합니다.</span></div>
  <div class="r"><span class="tag">body-sm</span><span class="spec">15 / 400</span><span class="sample" style="font:var(--text-body-sm)">통화 마무리 시 다음 일정을 확인하세요.</span></div>
  <div class="r"><span class="tag">label</span><span class="spec">14 / 500</span><span class="sample" style="font:var(--text-label)">부족한 표현 연습하기</span></div>
  <div class="r"><span class="tag">caption</span><span class="spec">12 / 500</span><span class="sample" style="font:var(--text-caption)">2026년 06월 02일 화요일</span></div>
  <div class="r"><span class="tag">micro</span><span class="spec">10 / 500</span><span class="sample" style="font:var(--text-micro)">돌아보기</span></div>
</body>
</html>
