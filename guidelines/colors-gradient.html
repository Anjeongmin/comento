<!-- @dsCard group="Colors" viewport="700x170" name="Brand gradients" subtitle="The hero / CTA gradient" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 22px; }
  .row { display: flex; gap: 16px; }
  .g { flex: 1; height: 96px; border-radius: 18px; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; }
  .lbl { font-size: 11px; font-weight: 700; color: #fff; font-family: ui-monospace, monospace; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
</style>
</head>
<body>
  <div class="row">
    <div class="g" style="background:var(--gradient-brand); box-shadow: var(--shadow-fab);"><span class="lbl">--gradient-brand</span></div>
    <div class="g" style="background:var(--gradient-brand-soft);"><span class="lbl">--gradient-brand-soft</span></div>
  </div>
</body>
</html>
