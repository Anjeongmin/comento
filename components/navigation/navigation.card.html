<!-- @dsCard group="Components" viewport="700x430" name="Navigation — Header, Tabs, BottomNav" subtitle="App bar, report tabs, bottom nav + call FAB" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-subtle); padding: 24px; color: var(--text-strong); }
  .phone { width: 360px; background:#fff; border-radius: 20px; overflow:hidden; box-shadow: var(--shadow-elevated); }
  .hdr { display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 16px; border-bottom:1px solid var(--border-subtle); }
  .hdr .t { font-size:20px; font-weight:700; }
  .ic { color:var(--color-primary); display:flex; }
  .tabs { display:flex; border-bottom:1px solid var(--border-subtle); }
  .tab { flex:1; text-align:center; padding:12px 0 14px; font-size:16px; font-weight:700; color:var(--text-muted); position:relative; }
  .tab.on { color:var(--color-primary); }
  .tab.on:after { content:""; position:absolute; left:18%; right:18%; bottom:-1px; height:3px; border-radius:3px; background:var(--color-primary); }
  .nav { position:relative; display:flex; align-items:flex-end; height:84px; padding:0 8px 14px; border-top:1px solid var(--border-subtle); }
  .grp { display:flex; flex:1; }
  .navi { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; color:var(--text-muted); font-size:11px; font-weight:500; }
  .navi.on { color:var(--color-primary); font-weight:700; }
  .gap { width:76px; flex-shrink:0; }
  .fab { position:absolute; left:50%; top:-22px; transform:translateX(-50%); width:64px; height:64px; border-radius:50%; border:4px solid #fff; background:var(--gradient-brand); box-shadow:var(--shadow-fab); display:flex; align-items:center; justify-content:center; color:#fff; }
  svg { display:block; }
</style>
</head>
<body>
  <div class="phone">
    <div class="hdr">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="t">AI 종합 리포트</span>
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.2" fill="currentColor"/><circle cx="18" cy="6" r="2.2" fill="currentColor"/><circle cx="18" cy="18" r="2.2" fill="currentColor"/><path d="M8 11l8-4M8 13l8 4" stroke="currentColor" stroke-width="2"/></svg></span>
    </div>
    <div class="tabs">
      <div class="tab">종합</div><div class="tab on">감정</div><div class="tab">표현</div><div class="tab">흐름</div>
    </div>
    <div style="height:90px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:13px">— 리포트 본문 —</div>
    <div class="nav">
      <div class="grp">
        <div class="navi on"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V20a1 1 0 001 1h12a1 1 0 001-1V9.5" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linejoin="round"/></svg>홈</div>
        <div class="navi"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2V5z" stroke="currentColor" stroke-width="2"/><path d="M20 5a2 2 0 00-2-2h-5v18h5a2 2 0 002-2V5z" stroke="currentColor" stroke-width="2"/></svg>감정 기록</div>
      </div>
      <div class="gap"></div>
      <div class="grp">
        <div class="navi"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.7-3.8-9S9.5 5.5 12 3z" stroke="currentColor" stroke-width="2"/></svg>자막</div>
        <div class="navi"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M7 18a4 4 0 01-.6-7.96 5.5 5.5 0 0110.86-1.2A3.75 3.75 0 0117.5 18H7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>돌아보기</div>
      </div>
      <div class="fab"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M6.6 10.8a13 13 0 006.6 6.6l2.2-2.2a1 1 0 011-.24c1.1.37 2.3.57 3.5.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.3a1 1 0 011 1c0 1.2.2 2.4.57 3.5a1 1 0 01-.24 1l-2.2 2.3z" fill="currentColor"/></svg></div>
    </div>
  </div>
</body>
</html>
