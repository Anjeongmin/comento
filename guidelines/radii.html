<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="From chips (8) to hero cards (24) to pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 24px; }
  .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 72px; height: 56px; background: var(--surface-subtle); box-shadow: inset 0 0 0 1.5px var(--red-400); }
  .nm { font-size: 11px; font-weight: 700; color: var(--gray-700); }
  .px { font-size: 10px; color: var(--gray-400); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="nm">xs</div><div class="px">8</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="nm">sm</div><div class="px">10</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-md)"></div><div class="nm">md</div><div class="px">12</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="nm">lg</div><div class="px">16</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="nm">xl</div><div class="px">20</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="nm">2xl</div><div class="px">24</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--radius-pill); width:96px"></div><div class="nm">pill</div><div class="px">9999</div></div>
  </div>
</body>
</html>
