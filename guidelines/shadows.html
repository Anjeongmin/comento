<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation & shadows" subtitle="Hairline ring · resting card · floating · FAB glow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 28px; }
  .row { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box { width: 110px; height: 72px; border-radius: 16px; background: #fff; }
  .fab { width: 64px; height: 64px; border-radius: 50%; background: var(--gradient-brand); }
  .nm { font-size: 11px; font-weight: 700; color: var(--gray-700); }
  .tk { font-size: 9.5px; color: var(--gray-400); font-family: ui-monospace,monospace; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="box" style="box-shadow:var(--ring-subtle)"></div><div class="nm">hairline</div><div class="tk">--ring-subtle</div></div>
    <div class="sw"><div class="box" style="box-shadow:var(--shadow-card-hairline)"></div><div class="nm">resting card</div><div class="tk">--shadow-card-hairline</div></div>
    <div class="sw"><div class="box" style="box-shadow:var(--shadow-float)"></div><div class="nm">floating</div><div class="tk">--shadow-float</div></div>
    <div class="sw"><div class="box" style="box-shadow:var(--shadow-elevated)"></div><div class="nm">elevated</div><div class="tk">--shadow-elevated</div></div>
    <div class="sw"><div class="fab" style="box-shadow:var(--shadow-fab)"></div><div class="nm">FAB glow</div><div class="tk">--shadow-fab</div></div>
  </div>
</body>
</html>
