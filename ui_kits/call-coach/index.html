  .scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

</style>

  sparkle: (p={}) => <svg width="20" height="20" viewBox="0 0 24 24" {...p}><path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z" fill="currentColor"/><circle cx="18.5" cy="17.5" r="1.4" fill="currentColor"/></svg>,
  arrow: (p={}) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  robot: (p={}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" {...p}><path d="M12 3v3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><circle cx="12" cy="2.5" r="1.3" fill="currentColor"/><rect x="4" y="7" width="16" height="12" rx="4" stroke="currentColor" strokeWidth="2"/><circle cx="9" cy="13" r="1.6" fill="currentColor"/><circle cx="15" cy="13" r="1.6" fill="currentColor"/><path d="M2 11v4M22 11v4" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>,
  send: (p={}) => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" {...p}><path d="M4 12l16-7-7 16-2.5-6.5L4 12z" fill="currentColor"/></svg>,
  thumb: (p={}) => <svg width="18" height="18" viewBox="0 0 24 24" {...p}><path d="M7 10v10H4V10h3zm3 0l3.5-7c1.2 0 2 1 1.8 2.2L17.5 9H21c1.1 0 2 1 1.8 2.1l-1.4 7c-.2 1-1 1.7-2 1.7H10V10z" fill="currentColor"/></svg>,

  cloud: (a) => <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M7.2 19a4.2 4.2 0 01-.5-8.37 5.5 5.5 0 0110.65-1.3A4 4 0 0117 19H7.2z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" fill={a?"currentColor":"none"} fillOpacity={a?0.12:0}/></svg>,

/* ---------- shared bits ---------- */
function StatusBar() { return null; }

function CTAButton({ children, onClick, variant="primary", style }) {
  const v = variant==="primary"
    ? { background:'var(--gradient-brand)', color:'#fff', boxShadow:'var(--shadow-fab)' }
    : { background:'var(--surface-subtle)', color:'var(--gray-700)', boxShadow:'var(--ring-default)' };
  const [p,setP]=useState(false);
  return <button onClick={onClick} onPointerDown={()=>setP(true)} onPointerUp={()=>setP(false)} onPointerLeave={()=>setP(false)}
    style={{width:'100%',height:56,border:'none',borderRadius:'var(--radius-pill)',fontSize:18,fontWeight:700,
    transform:p?'scale(0.97)':'none',transition:'transform .12s',...v,...style}}>{children}</button>;
}

function BottomNav({ tab, setTab, onCall }) {
  const tabs=[['home','홈',I.home],['emotion','감정 기록',I.book]];
  const tabs2=[['subtitle','자막',I.globe],['review','돌아보기',I.cloud]];
  const T=([k,l,ic])=>{const a=tab===k;return <button key={k} onClick={()=>setTab(k)} style={{flex:1,border:'none',background:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:4,padding:'6px 0',color:a?'var(--color-primary)':'var(--text-muted)'}}>{ic(a)}<span style={{fontSize:11,fontWeight:a?700:500}}>{l}</span></button>;};
  return (
    <div style={{position:'relative',display:'flex',alignItems:'flex-end',height:84,padding:'0 8px 16px',borderTop:'1px solid var(--border-subtle)',background:'#fff',flexShrink:0}}>
      <div style={{display:'flex',flex:1}}>{tabs.map(T)}</div>
      <div style={{width:76,flexShrink:0}}/>
      <div style={{display:'flex',flex:1}}>{tabs2.map(T)}</div>
      <button onClick={onCall} style={{position:'absolute',left:'50%',top:-22,transform:'translateX(-50%)',width:64,height:64,borderRadius:'50%',border:'4px solid #fff',background:'var(--gradient-brand)',boxShadow:'var(--shadow-fab)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}>{I.phone({width:28,height:28})}</button>
    </div>
  );
}

/* ---------- screens ---------- */
function Dots({ active }) {
  return (
    <div style={{padding:'0 22px',display:'flex',gap:8}}>
      {[0,1,2,3].map(i=><div key={i} style={{height:12,width:i===active?24:12,borderRadius:30,background:i===active?'var(--color-primary)':'var(--gray-200)',transition:'all .25s var(--ease-standard)'}}/>)}
    </div>
  );
}

const PERM_ICON = {
  contacts: <svg width="56" height="56" viewBox="0 0 24 24"><path d="M6.6 10.8a13 13 0 006.6 6.6l2.2-2.2a1 1 0 011-.24c1.1.37 2.3.57 3.5.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.3a1 1 0 011 1c0 1.2.2 2.4.57 3.5a1 1 0 01-.24 1l-2.2 2.3z" fill="currentColor"/></svg>,
  mic: <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>,
};

function OnboardPermission({ step, icon, title, body, onNext }) {
  return (
    <div className="screen fade">
      <StatusBar/>
      <Dots active={step}/>
      <div className="scroll" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 32px 40px',gap:28}}>
        <div style={{width:180,height:180,borderRadius:'50%',background:'var(--red-50)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--color-primary)'}}>{icon}</div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:28,fontWeight:800,color:'var(--text-strong)'}}>{title}</div>
          <p style={{fontSize:17,color:'var(--text-body)',lineHeight:1.6,marginTop:16}}>{body}</p>
        </div>
      </div>
      <div style={{padding:'0 22px 44px',display:'flex',flexDirection:'column',gap:20,alignItems:'center',flexShrink:0}}>
        <CTAButton onClick={onNext}>권한 허용하기</CTAButton>
        <button onClick={onNext} style={{border:'none',background:'none',fontSize:16,fontWeight:600,color:'var(--text-muted)'}}>건너뛰기</button>
      </div>
    </div>
  );
}

const FEATURES = [
  ['summary','통화 자동 요약','AI가 대화를 요약해드립니다.'],
  ['emotion','감정 분석 피드백','대화 톤과 감정을 분석합니다.'],
  ['tip','맞춤 커뮤니케이션 팁','다음 통화를 더 잘 준비하세요.'],
];
const FEAT_ICON = {
  summary: <svg width="26" height="26" viewBox="0 0 24 24"><path d="M14 3l1.5 4L20 8.5 15.5 10 14 14l-1.5-4L8 8.5 12.5 7 14 3z" fill="currentColor"/><path d="M5 13l.9 2.4L8 16l-2.1.6L5 19l-.9-2.4L2 16l2.1-.6L5 13z" fill="currentColor"/></svg>,
  emotion: <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2V5z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/><path d="M20 5a2 2 0 00-2-2h-5v18h5a2 2 0 002-2V5z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/></svg>,
  tip: <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.6.45 1 1.15 1 1.95V16h5.2v-.25c0-.8.4-1.5 1-1.95A6 6 0 0012 3z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/></svg>,
};

function OnboardFeatures({ onDone }) {
  return (
    <div className="screen fade">
      <StatusBar/>
      <Dots active={3}/>
      <div className="scroll" style={{display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 24px 40px'}}>
        <div style={{fontSize:28,fontWeight:800,color:'var(--text-strong)',marginBottom:32}}>이런 기능을 제공해요!</div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          {FEATURES.map(([k,t,d])=>(
            <div key={k} style={{display:'flex',alignItems:'center',gap:16,padding:'18px 20px',borderRadius:'var(--radius-pill)',background:'#fff',boxShadow:'inset 0 0 0 1.5px var(--red-200)'}}>
              <div style={{width:52,height:52,borderRadius:14,background:'var(--surface-muted)',color:'var(--color-primary)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{FEAT_ICON[k]}</div>
              <div>
                <div style={{fontSize:17,fontWeight:700,color:'var(--text-strong)'}}>{t}</div>
                <div style={{fontSize:15,color:'var(--text-body)',marginTop:3}}>{d}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div style={{padding:'0 22px 44px',flexShrink:0}}>
        <CTAButton onClick={onDone}>시작하기</CTAButton>
      </div>
    </div>
  );
}

function Onboarding({ onDone }) {
  const [step,setStep]=useState(0);
  const next=()=>setStep(s=>s+1);
  if(step===0) return (
    <div className="screen fade">
      <StatusBar/>
      <Dots active={0}/>
      <div className="scroll" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 32px 40px',gap:28}}>
        <div style={{width:180,height:180,borderRadius:'50%',background:'var(--red-50)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <img src={"../../assets/mascot-head-happy.png"} style={{width:'76%'}}/>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:28,fontWeight:800,color:'var(--text-strong)'}}>안녕하세요!</div>
          <p style={{fontSize:17,color:'var(--text-body)',lineHeight:1.6,marginTop:16}}>AI가 당신의 통화를 분석하고<br/>더 나은 대화를 도와드립니다.</p>
        </div>
      </div>
      <div style={{padding:'0 22px 44px',display:'flex',flexDirection:'column',gap:20,alignItems:'center',flexShrink:0}}>
        <CTAButton onClick={next}>다음</CTAButton>
        <span style={{fontSize:15,fontWeight:600,color:'var(--text-muted)'}}>서비스 이용약관 · 개인정보처리방침</span>
      </div>
    </div>
  );
  if(step===1) return <OnboardPermission step={1} icon={PERM_ICON.contacts} title="연락처 접근 허용" body={<>앱에서 직접 전화를 걸고,<br/>통화 후 피드백을 받으려면 연락처가 필요해요.</>} onNext={next}/>;
  if(step===2) return <OnboardPermission step={2} icon={PERM_ICON.mic} title="마이크 접근 허용" body={<>통화 내용을 분석하려면 마이크 권한이 필요합니다. 언제든지 설정에서 변경할 수 있어요.</>} onNext={next}/>;
  return <OnboardFeatures onDone={onDone}/>;
}

function Login({ onDone }) {
  const Field=({label,type})=>{const[f,setF]=useState(false);return(
    <input placeholder={label} type={type} onFocus={()=>setF(true)} onBlur={()=>setF(false)}
      style={{height:54,border:`1.5px solid ${f?'var(--color-primary)':'var(--red-200)'}`,borderRadius:'var(--radius-pill)',padding:'0 20px',fontSize:16,outline:'none',background:'#fff',fontFamily:'var(--font-sans)',color:'var(--text-strong)'}}/>
  );};
  const soc=[["../../assets/icons/naver.svg"],["../../assets/icons/google.svg"],["../../assets/icons/kakao.svg"]];
  return (
    <div className="screen fade" style={{background:'#FF3C3C'}}>
      <StatusBar onBrand/>
      <div className="scroll" style={{display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 24px 32px'}}>
        <div style={{display:'flex',justifyContent:'center',marginBottom:16}}>
          <img src={"../../assets/mascot-happy.png"} style={{width:160,filter:'drop-shadow(0 16px 24px rgba(120,0,0,.3))'}}/>
        </div>
        <div style={{background:'#fff',borderRadius:28,padding:'28px 24px 32px',display:'flex',flexDirection:'column',gap:16,boxShadow:'0 20px 60px rgba(120,0,0,.22)'}}>
          <div style={{textAlign:'center',fontSize:26,fontWeight:800,color:'var(--color-primary)',letterSpacing:'.06em',marginBottom:4}}>LOGIN</div>
          <Field label="ID" type="text"/>
          <Field label="PASSWORD" type="password"/>
          <div style={{marginTop:4}}><CTAButton onClick={onDone}>LOGIN</CTAButton></div>
          <div style={{textAlign:'center',fontSize:15,fontWeight:700,color:'var(--color-primary)'}}>회원가입</div>
          <div style={{display:'flex',justifyContent:'center',gap:20,marginTop:4}}>
            {soc.map(([src],i)=><div key={i} style={{width:40,height:40,borderRadius:'50%',background:'var(--surface-muted)',display:'flex',alignItems:'center',justifyContent:'center'}}><img src={src} style={{width:22}}/></div>)}
          </div>
        </div>
      </div>
    </div>
  );
}

const CALLS=[
  {n:'이지수 팀장',t:'오전 11:30 · 05분 12초',dir:'in'},
  {n:'박지훈 대표',t:'오전 09:15 · 12분 45초',dir:'out'},
  {n:'강민석 파트너',t:'어제 18:40 · 02분 20초',dir:'out'},
  {n:'부재중 전화 (010-…)',t:'어제 15:20 · 미응답',dir:'miss'},
];

const CHEV = (p={}) => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" {...p}><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>;

  return (
    <div style={{display:'flex',alignItems:'center',gap:14,padding:'16px 4px',borderBottom:last?'none':'1px solid var(--border-subtle)'}}>
      <div style={{width:44,height:44,borderRadius:'50%',background:'var(--red-50)',color:iconColor,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{icon}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:17,fontWeight:700,color:'var(--text-strong)'}}>{title}</div>

  return (
    <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--gray-100)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--color-primary)" strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dashoffset .9s var(--ease-out)'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <span style={{fontSize:big,fontWeight:800,color:'var(--color-primary)',lineHeight:1}}>{value}</span>

    </div>
  );

function Splash({ onDone }) {
  const bgRef = useRef(null);
  const mainRef = useRef(null);
  const wmarkRef = useRef(null);

  useEffect(() => {
    const bgEl = bgRef.current, mainEl = mainRef.current, wmark = wmarkRef.current;
    if (!bgEl || !mainEl || !wmark) return;

    bgEl.width = window.innerWidth;
    bgEl.height = window.innerHeight;
    const bgCtx = bgEl.getContext('2d');
    const ctx = mainEl.getContext('2d');

    const W = 300, H = 360, CX = 150, CY = 180;
    const SZ = 200; // mascot draw size

    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
    function lerp(a,b,t){return a+(b-a)*t;}
    function easeOutBack(t){const c=2.70158;return 1+c*Math.pow(t-1,3)+(c-1)*Math.pow(t-1,2);}
    function easeOutExpo(t){return t===1?1:1-Math.pow(2,-10*t);}
    function easeOutQuart(t){return 1-Math.pow(1-t,4);}

    const charImg = new Image(), logoImg = new Image();
    charImg.src = '../../assets/mascot-happy.png';
    logoImg.src = '../../assets/mascot-head-happy.png';

    let animId = null, pieces = [], sparks = [], shockwave = null;
    const failsafe = setTimeout(onDone, 3500);

    function buildPieces() {
      const oc = document.createElement('canvas');
      oc.width = SZ; oc.height = SZ;
      oc.getContext('2d').drawImage(charImg, 0, 0, SZ, SZ);
      pieces = [];
      const COLS=5, ROWS=5, pw=SZ/COLS, ph=SZ/ROWS;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const sx=c*pw, sy=r*ph;
        const pcx=sx+pw/2-SZ/2, pcy=sy+ph/2-SZ/2;
        const dist=Math.sqrt(pcx*pcx+pcy*pcy)+1;
        const spd=2.8+Math.random()*5;
        pieces.push({img:oc,sx,sy,sw:pw,sh:ph,
          x:CX-SZ/2+sx+pw/2, y:CY-SZ/2+sy+ph/2,
          vx:(pcx/dist)*spd+(Math.random()-.5)*2,
          vy:(pcy/dist)*spd-Math.random()*3.5,
          rot:0, rotV:(Math.random()-.5)*0.4, alpha:1, pw, ph});
      }
    }

    function buildSparks() {
      const cols=['#FF3639','#FF6363','#FFD23F','#FF8C8D','#FF1C1F','#FABC27','#fff'];
      for(let i=0;i<72;i++){
        const a=Math.random()*Math.PI*2, s=1.5+Math.random()*7.5;
        sparks.push({x:CX,y:CY,vx:Math.cos(a)*s,vy:Math.sin(a)*s-Math.random()*3,
          r:1+Math.random()*3,color:cols[Math.floor(Math.random()*cols.length)],
          life:1, decay:0.016+Math.random()*0.024});
      }
    }

    function run() {
      pieces=[]; sparks=[]; shockwave=null;
      ctx.clearRect(0,0,W,H);
      bgCtx.clearRect(0,0,bgEl.width,bgEl.height);
      wmark.style.opacity='0';

      const T_APPEAR_END=550, T_BURST=820, T_LOGO_IN=900, T_LOGO_END=1280;
      const T_NAME_IN=1200, T_NAME_END=1650, TOTAL=2700;
      let burstDone=false;
      const t0=performance.now();

      function frame(now) {
        const t=now-t0;
        ctx.clearRect(0,0,W,H);
        bgCtx.clearRect(0,0,bgEl.width,bgEl.height);
        bgCtx.fillStyle='#FF3639';
        bgCtx.fillRect(0,0,bgEl.width,bgEl.height);

        // background glow
        if(t>T_BURST && t<T_BURST+700){
          const gp=clamp((t-T_BURST)/500,0,1), peak=Math.sin(gp*Math.PI);
          const bx=bgEl.width/2, by=bgEl.height/2;
          const gr=bgCtx.createRadialGradient(bx,by,0,bx,by,220*peak+60);
          gr.addColorStop(0,`rgba(255,54,57,${.24*peak})`);
          gr.addColorStop(.5,`rgba(255,180,50,${.08*peak})`);
          gr.addColorStop(1,'rgba(0,0,0,0)');
          bgCtx.fillStyle=gr; bgCtx.fillRect(0,0,bgEl.width,bgEl.height);
        }

        // shockwave
        if(shockwave){
          shockwave.r+=16; shockwave.life-=.055;
          if(shockwave.life>0){
            const bx=bgEl.width/2, by=bgEl.height/2;
            bgCtx.save(); bgCtx.beginPath();
            bgCtx.arc(bx,by,shockwave.r,0,Math.PI*2);
            bgCtx.strokeStyle=`rgba(255,54,57,${shockwave.life*.55})`;
            bgCtx.lineWidth=shockwave.life*10; bgCtx.stroke(); bgCtx.restore();
          } else shockwave=null;
        }

        // phase 1: char appears
        if(t<T_APPEAR_END){
          const p=clamp(t/T_APPEAR_END,0,1), sc=easeOutBack(p);
          ctx.save(); ctx.globalAlpha=clamp(p*2.5,0,1);
          ctx.translate(CX,CY); ctx.scale(lerp(.4,1,sc),lerp(.4,1,sc));
          ctx.drawImage(charImg,-SZ/2,-SZ/2,SZ,SZ); ctx.restore();
        }

        // phase 1.5: wobble/charge
        if(t>=T_APPEAR_END && t<T_BURST){
          const p=(t-T_APPEAR_END)/(T_BURST-T_APPEAR_END);
          const w=Math.sin(p*Math.PI*5)*.07*(1-p);
          ctx.save(); ctx.translate(CX,CY); ctx.scale(1-w,1+w);
          ctx.drawImage(charImg,-SZ/2,-SZ/2,SZ,SZ); ctx.restore();
          if(p>.4){
            const gp=(p-.4)/.6, bx=bgEl.width/2, by=bgEl.height/2;
            const gr=bgCtx.createRadialGradient(bx,by,0,bx,by,90*gp);
            gr.addColorStop(0,`rgba(255,100,50,${.18*gp})`);
            gr.addColorStop(1,'rgba(0,0,0,0)');
            bgCtx.fillStyle=gr; bgCtx.fillRect(0,0,bgEl.width,bgEl.height);
          }
        }

        // burst trigger
        if(t>=T_BURST && !burstDone){
          burstDone=true; buildPieces(); buildSparks();
          shockwave={r:12,life:1};
        }

        // phase 2: fragments + sparks
        if(burstDone){
          const el=t-T_BURST;
          pieces.forEach(p=>{
            p.x+=p.vx; p.y+=p.vy; p.vy+=.22; p.vx*=.96;
            p.rot+=p.rotV; p.alpha=clamp(1-el/400,0,1);
            if(p.alpha<=0) return;
            ctx.save(); ctx.globalAlpha=p.alpha;
            ctx.translate(p.x,p.y); ctx.rotate(p.rot);
            ctx.drawImage(p.img,p.sx,p.sy,p.sw,p.sh,-p.pw/2,-p.ph/2,p.pw,p.ph);
            ctx.restore();
          });
          sparks=sparks.filter(s=>s.life>0);
          sparks.forEach(s=>{
            s.x+=s.vx; s.y+=s.vy; s.vy+=.13; s.vx*=.97; s.life-=s.decay;
            if(s.life<=0) return;
            ctx.save(); ctx.globalAlpha=s.life;
            ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            ctx.fillStyle=s.color; ctx.fill(); ctx.restore();
          });
        }

        // phase 3: logo assembles
        if(t>=T_LOGO_IN){
          const p=clamp((t-T_LOGO_IN)/(T_LOGO_END-T_LOGO_IN),0,1);
          const sc=easeOutBack(p), al=easeOutExpo(p);
          const ry=lerp(0,-22,easeOutExpo(clamp((t-T_LOGO_IN)/800,0,1)));
          ctx.save(); ctx.globalAlpha=al;
          ctx.translate(CX,CY+ry); ctx.scale(sc,sc);
          ctx.beginPath(); ctx.arc(0,0,52,0,Math.PI*2);
          ctx.fillStyle='rgba(255,54,57,.2)'; ctx.fill();
          ctx.drawImage(logoImg,-44,-44,88,88);
          ctx.restore();
        }

        // phase 4: wordmark
        if(t>=T_NAME_IN){
          const p=clamp((t-T_NAME_IN)/(T_NAME_END-T_NAME_IN),0,1);
          wmark.style.opacity=String(easeOutQuart(p));
        }

        if(t<TOTAL){ animId=requestAnimationFrame(frame); }
        else{ clearTimeout(failsafe); onDone(); }
      }
      animId=requestAnimationFrame(frame);
    }

    let loaded=0;
    const onLoad=()=>{ if(++loaded>=2) setTimeout(run,80); };
    charImg.complete ? onLoad() : (charImg.onload=charImg.onerror=onLoad);
    logoImg.complete ? onLoad() : (logoImg.onload=logoImg.onerror=onLoad);

    return ()=>{ clearTimeout(failsafe); if(animId) cancelAnimationFrame(animId); };
  },[]);

  return (
    <div className="screen" style={{background:'#FF3639',overflow:'hidden'}}>
      <canvas ref={bgRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}}/>
      <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{position:'relative',width:300,height:360}}>
          <canvas ref={mainRef} width={300} height={360} style={{position:'absolute',inset:0}}/>
          <div ref={wmarkRef} style={{position:'absolute',bottom:-76,left:'50%',transform:'translateX(-50%)',display:'flex',flexDirection:'column',alignItems:'center',gap:6,opacity:0,pointerEvents:'none',whiteSpace:'nowrap'}}>
            <Wordmark/>
            <span style={{fontFamily:'var(--font-sans)',fontSize:12,fontWeight:500,letterSpacing:'.22em',color:'rgba(255,255,255,.45)',textTransform:'uppercase'}}>AI 통화 코치</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- app shell ---------- */
function App() {
  const [route,setRoute]=useState('splash');
  const [tab,setTab]=useState('home');
  const [reportTab,setReportTab]=useState('종합');

  const go=r=>setRoute(r);
  const navTo=t=>{ setTab(t); if(route!=='home') go('home'); };

  let view;
  if(route==='splash') view=<Splash onDone={()=>go('onboarding')}/>;
  else if(route==='onboarding') view=<Onboarding onDone={()=>go('login')}/>;
  else if(route==='login') view=<Login onDone={()=>go('home')}/>;
  else if(route==='report') view=<Report onBack={()=>go('aireport')} setNav={navTo} onCall={()=>go('calling')} start={reportTab}/>;
  else if(route==='aireport') view=<AIReport onBack={()=>{setTab('review');go('home');}} onDetail={()=>go('report')} setTab={navTo} onCall={()=>go('calling')}/>;
  else if(route==='chat') view=<Chat onBack={()=>{setTab('review');go('home');}}/>;
  else if(route==='settings') view=<Settings onBack={()=>go('home')} setTab={navTo} onCall={()=>go('calling')}/>;
  else if(route==='mypage') view=<MyPage onBack={()=>go('home')} setTab={navTo} onCall={()=>go('calling')}/>;
  else if(route==='calling') view=<Calling onEnd={()=>go('analyzing')}/>;
  else if(route==='analyzing') view=<Analyzing onClose={()=>{setTab('review');go('home');}} onDone={()=>go('complete')}/>;
  else if(route==='complete') view=<CompleteSheet onFeedback={()=>go('aireport')} onLater={()=>{setTab('review');go('home');}} onCall={()=>go('calling')} setTab={navTo}/>;
  else {
    if(tab==='home') view=<Home setTab={navTo} onCall={()=>go('calling')} onReport={()=>go('aireport')} onSettings={()=>go('settings')} onMyPage={()=>go('mypage')}/>;
    else if(tab==='emotion') view=<EmotionRecord setTab={navTo} onCall={()=>go('calling')}/>;
    else if(tab==='subtitle') view=<Subtitle setTab={navTo} onCall={()=>go('calling')}/>;
    else view=<Review setTab={navTo} onCall={()=>go('calling')} onSummary={()=>go('analyzing')} onChat={()=>go('chat')}/>;
  }
  return <div className="device">{view}</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
