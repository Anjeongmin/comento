<!-- @dsCard group="Colors" viewport="700x180" name="Brand red scale" subtitle="The single brand hue — #FF3639 is primary" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 22px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 92px; height: 64px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .nm { font-size: 12px; font-weight: 700; color: var(--gray-800); }
  .hex { font-size: 11px; color: var(--gray-500); letter-spacing: .01em; }
  .star { font-size: 10px; color: var(--red-500); font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--red-50)"></div><div class="nm">red-50</div><div class="hex">#FFF1F1</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-100)"></div><div class="nm">red-100</div><div class="hex">#FFD5D5</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-200)"></div><div class="nm">red-200</div><div class="hex">#FFB4B4</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-300)"></div><div class="nm">red-300</div><div class="hex">#F8686A</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-400)"></div><div class="nm">red-400</div><div class="hex">#FF6363</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-500); box-shadow: 0 0 0 2px var(--red-500), inset 0 0 0 2px #fff;"></div><div class="nm">red-500 <span class="star">★ PRIMARY</span></div><div class="hex">#FF3639</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-600)"></div><div class="nm">red-600</div><div class="hex">#FF494C</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-700)"></div><div class="nm">red-700</div><div class="hex">#EF0000</div></div>
  </div>
</body>
</html>
