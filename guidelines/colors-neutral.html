<!-- @dsCard group="Colors" viewport="700x180" name="Neutral gray ramp" subtitle="Cool grays for text, surfaces & borders" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 22px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 60px; height: 64px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .nm { font-size: 11px; font-weight: 700; color: var(--gray-800); }
  .hex { font-size: 10px; color: var(--gray-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--gray-50)"></div><div class="nm">50</div><div class="hex">F9FAFB</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="nm">100</div><div class="hex">F3F4F6</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="nm">200</div><div class="hex">E5E7EB</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-300)"></div><div class="nm">300</div><div class="hex">D1D5DB</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="nm">400</div><div class="hex">9CA3AF</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="nm">500</div><div class="hex">6B7280</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-600)"></div><div class="nm">600</div><div class="hex">4B5563</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="nm">700</div><div class="hex">374151</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-800)"></div><div class="nm">800</div><div class="hex">1F2937</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="nm">900</div><div class="hex">111827</div></div>
  </div>
</body>
</html>
