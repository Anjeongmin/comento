<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 24px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .sw { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .bar { background: var(--red-100); border-radius: 4px; }
  .nm { font-size: 11px; font-weight: 700; color: var(--gray-700); }
  .px { font-size: 10px; color: var(--gray-400); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="bar" style="width:4px;height:4px"></div><div class="nm">1</div><div class="px">4</div></div>
    <div class="sw"><div class="bar" style="width:8px;height:8px"></div><div class="nm">2</div><div class="px">8</div></div>
    <div class="sw"><div class="bar" style="width:12px;height:12px"></div><div class="nm">3</div><div class="px">12</div></div>
    <div class="sw"><div class="bar" style="width:16px;height:16px"></div><div class="nm">4</div><div class="px">16</div></div>
    <div class="sw"><div class="bar" style="width:20px;height:20px"></div><div class="nm">5</div><div class="px">20</div></div>
    <div class="sw"><div class="bar" style="width:24px;height:24px"></div><div class="nm">6</div><div class="px">24</div></div>
    <div class="sw"><div class="bar" style="width:32px;height:32px"></div><div class="nm">7</div><div class="px">32</div></div>
    <div class="sw"><div class="bar" style="width:40px;height:40px"></div><div class="nm">8</div><div class="px">40</div></div>
  </div>
</body>
</html>
